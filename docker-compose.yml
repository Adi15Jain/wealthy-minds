# Full-stack local/prod orchestration: Postgres + FastAPI analytics + Next.js.
#
#   docker compose up --build
#
# Provide secrets via a root .env file (see .env.example). The web service
# runs `prisma db push` on start so the schema is applied to a fresh DB.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-wealthyminds}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wealthyminds}
      POSTGRES_DB: ${POSTGRES_DB:-wealthyminds}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-wealthyminds}"]
      interval: 5s
      timeout: 5s
      retries: 10

  analytics:
    build: ./services/analytics
    restart: unless-stopped
    environment:
      PORT: 8000
      ALLOWED_ORIGINS: '["http://localhost:3000"]'
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)\""]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      analytics:
        condition: service_started
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-wealthyminds}:${POSTGRES_PASSWORD:-wealthyminds}@db:5432/${POSTGRES_DB:-wealthyminds}
      AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET is required}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_AI_API_KEY: ${GOOGLE_AI_API_KEY:-}
      GROWW_API_KEY: ${GROWW_API_KEY:-}
      ANALYTICS_SERVICE_URL: http://analytics:8000
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
    ports:
      - "3000:3000"

volumes:
  pgdata:
